name: quake

x-health-retry:
  &health-retry
  interval: 1s
  timeout: 10s
  retries: 30

x-aws-base:
  &aws-base
  AWS_PROFILE: ${AWS_PROFILE:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY:
  AWS_SESSION_TOKEN:

services:

  validator1_el:
    container_name: validator1_el
    image: ghcr.io/test/arc-execution:snap
    entrypoint: ["/app/assets/entrypoint_el.sh"]
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8545' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      default:
        ipv4_address: 172.21.2.0
      host-access:
    volumes:
      - ./validator1/reth:/data/reth/execution-data
      - ./assets:/app/assets
      - ./logs:/var/log/arc
      - ./validator1/latency_setup.sh:/usr/local/bin/latency_setup.sh
      - ./validator1/sockets:/sockets/
    ports:
      - "8545:8545" # HTTP
      - "8546:8546" # WS
      - "8551:8551" # AuthRPC
      - "9001:9001" # Metrics
      - "6161:6061" # Pprof
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ARC_LOG_FILE: /var/log/arc/validator1_el.log
      RUST_LOG: debug,net::peers=trace,net::discovery=trace,net::discv5=trace
    command:
      - "node"
      - "--datadir=/data/reth/execution-data"
      - "--chain=/app/assets/genesis.json"
      - "--http.port=8545"
      - "--http.addr=0.0.0.0"
      - "--http.corsdomain=*"
      - "--ws.port=8546"
      - "--ws.addr=0.0.0.0"
      - "--ws.origins=*"
      - "--metrics=0.0.0.0:9001"
      - "--log.file.directory=/var/log/arc"
      - "--log.file.max-files=0"
      - "--txpool.nolocals"
      - "--builder.deadline=1"
      - "--engine.persistence-threshold=0"
      - "--engine.memory-block-buffer-target=0"
      - "--enable-arc-rpc"
      - "--gpo.maxprice=5000000000"
      - "--http"
      - "--http.api=admin,net,eth,web3,debug,txpool,trace,reth"
      - "-vvvv"
      - "--rpc.txfeecap=1000"
      - "--ws"
      - "--ws.api=admin,net,eth,web3,debug,txpool,trace,reth"
      - "--arc.builder.deadline=100"
      - "--arc-rpc-upstream-url=http://validator1_cl:31000"
      - "--ipcpath=/sockets/reth.ipc"
      - "--auth-ipc"
      - "--auth-ipc.path=/sockets/auth.ipc"
      - "--p2p-secret-key=/data/reth/execution-data/nodekey" # default is <datadir>/discovery-secret and randomly generated

  validator1_cl:
    container_name: validator1_cl
    image: ghcr.io/test/arc-consensus:snap
    entrypoint: ["/app/assets/entrypoint_cl.sh"]
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        ipv4_address: 172.21.1.0
      host-access:
    depends_on:
      validator1_el:
        condition: service_healthy
    volumes:
      - ./validator1/malachite:/app/.malachite/
      - ./assets:/app/assets
      - ./logs:/var/log/arc
      - ./validator1/latency_setup.sh:/usr/local/bin/latency_setup.sh
      - ./validator1/sockets:/sockets/
    ports:
      - "27000:27000" # Consensus
      - "29000:29000" # Metrics
      - "6060:6060" # Pprof
      - "31000:31000" # RPC
    environment:
      ARC_LOG_FILE: /var/log/arc/validator1_cl.log
      ARC_HALT_AT_BLOCK_HEIGHT: 0
      ARC_GENESIS_FILE_PATH: /app/assets/genesis.json
      CL_GLOBAL: "1"
      CL_NODE: "one"
    command:
      - "start"
      - "--home=/app/.malachite"
      - "--moniker=validator1"
      - "--eth-socket=/sockets/reth.ipc"
      - "--execution-socket=/sockets/auth.ipc"




