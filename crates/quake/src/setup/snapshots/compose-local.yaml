  ### Blockscout ###

  # Blockscout will be available at http://localhost
  blockscout-db-init:
    extends:
      file: ../../deployments/blockscout.yaml
      service: db-init
    volumes:
      - ./blockscout/db:/var/lib/postgresql/data
    networks:
      - blockscout

  blockscout-db:
    depends_on:
      blockscout-db-init:
        condition: service_completed_successfully
    extends:
      file: ../../deployments/blockscout.yaml
      service: db
    volumes:
      - ./blockscout/db:/var/lib/postgresql/data
    networks:
      - blockscout

  blockscout-backend:
    depends_on:
      blockscout-db:
        condition: service_healthy
      validator1_el:
        condition: service_healthy
    extends:
      file: ../../deployments/blockscout.yaml
      service: backend
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545/
        ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545/
        ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8546/
        CHAIN_ID: '1337'
    volumes:
      - ./blockscout/logs/:/app/logs/
      - ./blockscout/dets/:/app/dets/
      - ../../deployments/monitoring/config-blockscout/proxy:/etc/nginx/templates:ro
    networks:
      - blockscout

  blockscout-frontend:
    depends_on:
      - blockscout-backend
    extends:
      file: ../../deployments/blockscout.yaml
      service: frontend
    volumes:
      - ../../deployments/monitoring/config-blockscout/frontend/.curlrc:/home/nextjs/.curlrc:ro
    networks:
      - blockscout

  blockscout-proxy:
    depends_on:
      - blockscout-backend
      - blockscout-frontend
    extends:
      file: ../../deployments/blockscout.yaml
      service: proxy
    volumes:
      - ../../deployments/monitoring/config-blockscout/proxy:/etc/nginx/templates:ro
    networks:
      - blockscout

# Internal networks cannot route to external networks, enforcing subnet isolation.
# This is necessary because Docker Desktop does not isolate bridge networks by default.
# Port publishing still works with internal networks.
networks:
  default:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
  # Blockscout uses host.docker.internal to access nodes
  blockscout:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  # Non-internal network for port publishing from containers on internal subnet networks
  host-access:
    driver: bridge

secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
