[package]
name = "utxo-state"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "utxo-bench"
path = "src/main.rs"

[dependencies]
alloy-primitives = "1.6"
alloy-trie = "0.9.5"
curve25519-dalek-ng = { version = "4.1", features = ["u64_backend"] }
sha2 = "0.9"

[profile.release]
opt-level = 3

# standalone: detach from the arc-node workspace (and its reth fork patch)
[workspace]
