[package]
name = "salt-lane"
version = "0.1.0"
edition = "2021"

# DETACHED from the arc-node workspace (same trick as experiments/utxo-state). This is load-
# bearing, not cosmetic: SALT requires [patch.crates-io] repointing ark-ff/ark-ec/ark-serialize/
# ark-ed-on-bls12-381-bandersnatch at MegaETH's algebra fork. Patches apply only from a workspace
# ROOT and do not propagate from dependencies, so putting them in arc-node's root would repoint
# ALL 11 ark-* crates the main tree already resolves (ark-bls12-381, ark-bn254, ark-ff 0.3/0.4.2/
# 0.5). Detaching keeps that blast radius to this crate.
[workspace]

# [patch.crates-io]
# ark-ed-on-bls12-381-bandersnatch = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695" }
# ark-ff = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695" }
# ark-ec = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695" }
# ark-serialize = { git = "https://github.com/megaeth-labs/algebra.git", rev = "80ca69c37f79d5d00750edc1602af81b5f456695" }

[dependencies]
salt = { git = "https://github.com/megaeth-labs/salt" }
hashbrown = "0.16"
tiny-keccak = { version = "2.0", features = ["keccak"] }
rand = "0.8"

[[bin]]
name = "salt-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
