<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Inter,Helvetica,Arial,sans-serif">
<rect width="980" height="580" fill="#ffffff"/>
<text x="88" y="34" font-size="19" font-weight="700" fill="#1a1f2e">Payment lane, sustained: the gas limit is a dial that only acts while it binds</text>
<text x="88" y="56" font-size="12.5" fill="#7b8394">4 machines · 15 minutes per point · sampled every 60 s · demand tuned to just fill each block</text>
<line x1="88" y1="476.0" x2="936" y2="476.0" stroke="#e6e9ef"/>
<text x="78" y="480.0" font-size="11" fill="#7b8394" text-anchor="end">0</text>
<line x1="88" y1="397.6" x2="936" y2="397.6" stroke="#e6e9ef"/>
<text x="78" y="401.6" font-size="11" fill="#7b8394" text-anchor="end">1,800</text>
<line x1="88" y1="319.2" x2="936" y2="319.2" stroke="#e6e9ef"/>
<text x="78" y="323.2" font-size="11" fill="#7b8394" text-anchor="end">3,600</text>
<line x1="88" y1="240.8" x2="936" y2="240.8" stroke="#e6e9ef"/>
<text x="78" y="244.8" font-size="11" fill="#7b8394" text-anchor="end">5,400</text>
<line x1="88" y1="162.4" x2="936" y2="162.4" stroke="#e6e9ef"/>
<text x="78" y="166.4" font-size="11" fill="#7b8394" text-anchor="end">7,200</text>
<line x1="88" y1="84.0" x2="936" y2="84.0" stroke="#e6e9ef"/>
<text x="78" y="88.0" font-size="11" fill="#7b8394" text-anchor="end">9,000</text>
<line x1="161.1" y1="84" x2="161.1" y2="476" stroke="#e6e9ef"/>
<text x="161.1" y="494" font-size="11" fill="#7b8394" text-anchor="middle">500</text>
<line x1="234.2" y1="84" x2="234.2" y2="476" stroke="#e6e9ef"/>
<text x="234.2" y="494" font-size="11" fill="#7b8394" text-anchor="middle">1000</text>
<line x1="380.4" y1="84" x2="380.4" y2="476" stroke="#e6e9ef"/>
<text x="380.4" y="494" font-size="11" fill="#7b8394" text-anchor="middle">2000</text>
<line x1="526.6" y1="84" x2="526.6" y2="476" stroke="#e6e9ef"/>
<text x="526.6" y="494" font-size="11" fill="#7b8394" text-anchor="middle">3000</text>
<line x1="672.8" y1="84" x2="672.8" y2="476" stroke="#e6e9ef"/>
<text x="672.8" y="494" font-size="11" fill="#7b8394" text-anchor="middle">4000</text>
<line x1="819.0" y1="84" x2="819.0" y2="476" stroke="#e6e9ef"/>
<text x="819.0" y="494" font-size="11" fill="#7b8394" text-anchor="middle">5000</text>
<text x="512.0" y="516" font-size="12.5" font-weight="600" fill="#1a1f2e" text-anchor="middle">sustained block latency (ms)</text>
<text x="28" y="280.0" font-size="12.5" font-weight="600" fill="#1a1f2e" transform="rotate(-90 28 280.0)" text-anchor="middle">sustained throughput (tx/s)</text>
<line x1="161.1" y1="84" x2="161.1" y2="476" stroke="#15803d" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="168.1" y="98" font-size="11" font-weight="600" fill="#15803d">2 blk/s</text>
<polyline points="189.9,178.6 267.8,140.6 888.9,159.3" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" opacity="0.75"/>
<circle cx="267.8" cy="140.6" r="6" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
<text x="267.8" y="127.6" font-size="9.5" fill="#b45309" text-anchor="middle">200M</text>
<circle cx="888.9" cy="159.3" r="6" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
<text x="888.9" y="146.3" font-size="9.5" fill="#b45309" text-anchor="middle">1000M</text>
<text x="526.6" y="185.3" font-size="11" fill="#b45309" text-anchor="middle">forcing the limit to bind (2x demand): latency grows, throughput does not</text>
<polyline points="164.0,376.4 166.5,283.0 189.9,178.6" fill="none" stroke="#0f766e" stroke-width="3"/>
<line x1="161.8" y1="376.4" x2="165.8" y2="376.4" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
<rect x="158.0" y="370.4" width="12" height="12" fill="#0f766e" stroke="#0f766e" stroke-width="2.4"/>
<text x="164.0" y="362.4" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">25M</text>
<line x1="165.1" y1="283.0" x2="170.8" y2="283.0" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
<rect x="160.5" y="277.0" width="12" height="12" fill="#0f766e" stroke="#0f766e" stroke-width="2.4"/>
<text x="166.5" y="269.0" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">50M</text>
<line x1="184.8" y1="178.6" x2="201.9" y2="178.6" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
<rect x="183.9" y="172.6" width="12" height="12" fill="#0f766e" stroke="#0f766e" stroke-width="2.4"/>
<text x="189.9" y="164.6" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">100M</text>
<line x1="164.6" y1="167.1" x2="259.9" y2="167.1" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
<rect x="182.9" y="161.1" width="12" height="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/>
<text x="188.9" y="153.1" font-size="10" font-weight="600" fill="#0f766e" text-anchor="middle">200M</text>
<text x="178.0" y="381.4" font-size="11" fill="#1a1f2e">25M — 520 ms, 2,287 tx/s  (sd 1.6%)</text>
<text x="180.5" y="288.0" font-size="11" fill="#1a1f2e">50M — 537 ms, 4,430 tx/s  (sd 1.8%)</text>
<text x="205.9" y="183.6" font-size="12" font-weight="700" fill="#0f766e">100M — 697 ms, 6,827 tx/s  (sd 3.6%)  ← best sustained</text>
<text x="204.9" y="155.1" font-size="10.5" fill="#7b8394">200M sits on top of 100M: the limit no longer binds (51% full)</text>
<rect x="88" y="530" width="12" height="12" fill="#0f766e"/>
<text x="106" y="540" font-size="11.5" fill="#1a1f2e">gas limit binds (block 100% full)</text>
<rect x="338" y="530" width="12" height="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
<text x="356" y="540" font-size="11.5" fill="#1a1f2e">limit does not bind</text>
<text x="88" y="558" font-size="10.5" fill="#7b8394">horizontal bars = min–max block latency across the 15 min. State root stayed 1.3–3.4 ms at every size.</text>
</svg>